name: Daily ETF Analysis

on:
  # Run every weekday at 05:00 UTC (07:00 Berlin time)
  schedule:
    - cron: '0 5 * * 1-5'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify email configuration
        run: |
          if [ -z "$EMAIL_ADDRESS" ]; then echo "::warning::EMAIL_ADDRESS is empty (not found in Repository Secrets or Variables)"; else echo "EMAIL_ADDRESS is set"; fi
          if [ -z "$EMAIL_PASSWORD" ]; then echo "::warning::EMAIL_PASSWORD is empty (not found in Repository Secrets or Variables)"; else echo "EMAIL_PASSWORD is set"; fi
          if [ -z "$RECIPIENT_EMAIL" ]; then echo "::warning::RECIPIENT_EMAIL is empty (not found in Repository Secrets or Variables)"; else echo "RECIPIENT_EMAIL is set"; fi
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS || vars.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD || vars.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL || vars.RECIPIENT_EMAIL }}

      - name: Run ETF analysis
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS || vars.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD || vars.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL || vars.RECIPIENT_EMAIL }}
        run: python main.py run

      - name: Save HTML report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-report-${{ github.run_id }}
          path: report_*.html
          retention-days: 30

      - name: Commit and push portfolio state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f portfolio.json
          if ! git diff --cached --quiet; then
            git commit -m "Update portfolio state [skip ci]"
            git pull --rebase
            git push
          fi
